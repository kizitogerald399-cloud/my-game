    <svg viewBox="0 0 300 150" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define the arrowhead reusable marker -->
    <marker 
      id="arrowhead" 
      viewBox="0 0 10 10" 
      refX="7" 
      refY="5" 
      markerWidth="6" 
      markerHeight="6" 
      orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Straight Arrow -->
  <line x1="20" y1="40" x2="260" y2="40" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Curved Arrow -->
  <path d="M 20 110 Q 140 60 260 110" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowhead)" />
</svg>
