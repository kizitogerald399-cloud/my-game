 <!DOCTYPE html>
    <html>
      <head>
        <title>Rock Paper Scissors</title>
      </head>
      <link rel="stylesheet" href="games.css">
      
      <body class="body">
        <div class="toolbar"><p>MY FIRST GAME</p></div>
        <div class="sidebar">
          <div><img src="Thumbnails/paper.png" class="icon" >PAPER</div>
          <div><img src="Thumbnails/rock.jpg" class="icon" >ROCK</div>
          <div><img src="Thumbnails/scissors.jpg" class="icon" >SCISSORS</div>
        </div>
        <div class="game"><p class="first">Rock Paper Scisssors</p></div>
      <div class="grid">
        <button onclick=" playGame('Rock')" class="button">Rock</button>
        <button onclick=" playGame('Paper')" class="button">Paper</button>
        <button onclick=" playGame('Scissors')" class="button">Scissors</button>
        <button onclick="score.wins = 0; score.losses = 0; score.ties = 0; updateScore();" class="button">Resset Score</button>
        <button class="button">WELCOME</button>
        <button class="button">HIGHLIGHT</button>
        <button  class="button" >MENU</button>
       
      </div>
      <p class="js-score">wins : 0 Losses:0 Ties:0</p>

        <p class="paragraph"><span class="click">Click here </span>to see the final version of the project </p></div>
        <div ><p class="game" class="first">Created by Engineer Kizito Gerald</p><img src="Thumbnails/kizito.jpeg" class="image"></div>

        <script>
          let score={
            wins: 0,
            losses:0,
            ties:0,

          }
         
        function playGame(playerMove){const randomNumber = Math.random();
        if(randomNumber >= 0 && randomNumber < 1 / 3){computerMove = 'Rock';
      } else if(randomNumber >= 1 / 3 && randomNumber < 2 / 3){computerMove = 'Paper';
    } else if(randomNumber >= 2 / 3 && randomNumber < 1){computerMove = 'Scissors';
  }  console.log(computerMove);
       let result = '';

  if (playerMove=== computerMove){result = 'Tie.'}
  else if ((computerMove==='Scissors' && playerMove === 'Rock')||
(computerMove==='Paper' && playerMove === 'Scissors')||
(computerMove==='Rock' && playerMove === 'Paper')) 
  {result='You win!'}
  else {result='You lose'}
  console.log(result);
  if (result==='You win!'){
    score.wins +=1;

  }else if (result==='You lose'){score.losses += 1;}
  else if(result==='Tie.'){score.ties +=1} 
  
        

 



  updateScore();


 
   alert(`You chose:${playerMove}.\ncomputer chose: ${computerMove}\n ${result}\n wins : ${score.wins} Losses:${score.losses} Ties:${score.ties}`)
  }
   

function updateScore(){
   document.querySelector('.js-score').innerHTML =`wins : ${score.wins} Losses:${score.losses} Ties:${score.ties}`;

}
      

        </script>

      </body>
      
    </html>
