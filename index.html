 <!DOCTYPE html>
    <html>
      <head>
        <title>Rock Paper Scissors</title>
      </head>
      <link rel="stylesheet" href="games.css">
      
      <body class="body">
     <div class="header">
          <div class="title"><div class="par">ROCK</div>
          <div class="par">PAPER</div>
          <div class="par special">SCISSORS</div></div>
        <div class="score-section">
          <div>score</div>
          <div id="score-value">0</div>
         </div>
        </div>
       
      <div class="grid">
        <img src="images/bg-triangle.svg" class="bg-triangle">
        <button id="rock" class="button rock"><img src="images/icon-rock.svg"></button>
        <button id="paper" class="button paper"><img src="images/icon-paper.svg"></button>
        <button id="scissors" class="button scissors"><img src="images/icon-scissors.svg"></button>
       
      </div>

      
      <!-- game result selection -->
      <div class="result hidden">
        <div class="player">
           <p >YOU PICKED</p>
        <div class="player-choice">
          </div>
        </div>
        <div class="house">
          <p>HOUSE PICKED</p>
          <div class="house-choice">
            
          </div>
        </div>
      </div>

      <svg viewBox="0 0 300 150 " width="100%" height=" 100%" >
        <defs>
          <marker id="arrow" viewBox="0  0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"  ><path d="M 0 0 L 10 5 L 0 10 z" fill="red"/></marker>
        </defs>
        <line x1="20" y1="50" x2="250" y2="50" stroke="red" stroke-width="4" marker-end="url(#arrow)"/>
      </svg>
      

      <!-- <button onclick="score.wins = 0; score.losses = 0; score.ties = 0; updateScore();" class="buttonj">Resset Score</button>-->
        
      <!-- <p class="js-score">wins : 0 Losses:0 Ties:0</p> -->

       <button id="style-btn" class="buttonz button2" >FOLLOW</button>
       <button class="rules" id="rules">RULES</button>

       <div class="maindiv" id="maindiv">
        <div class="div2">
         <p style="color:gray">RULES</p>
         <button id="close">
          <img src="images/icon-close.svg" id="close">
        </button>
      </div>
        <div class="div3">
          <img src="images/image-rules.svg" >
        </div>
        
       </div>
       

        <script src="games.js">
          
        </script>
         
        

      </body>
      
    </html>
